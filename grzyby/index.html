/* ================= public — PRO MINIMAL UI ================= */
:root{
  --side-w:336px;
  --gap:12px;
  --surface:rgba(15,18,17,.94);
  --surface-2:#202522;
  --surface-3:#272e2a;
  --line:rgba(255,255,255,.09);
  --text:#f4f7f5;
  --muted:#9da9a2;
  --green:#65d47d;
  --green-soft:#eaf6ed;
}

/* LAYOUT: sidebar i atlas nigdy nie leżą na sobie */
.panel{
  width:var(--side-w)!important;
  top:var(--gap)!important;
  left:var(--gap)!important;
  max-height:calc(100vh - 24px)!important;
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:18px!important;
  box-shadow:0 18px 50px rgba(0,0,0,.34)!important;
  backdrop-filter:blur(18px)!important;
}
.mushroom-atlas{
  left:calc(var(--side-w) + var(--gap) * 2)!important;
  right:var(--gap)!important;
  bottom:var(--gap)!important;
  border-radius:18px!important;
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  box-shadow:0 16px 42px rgba(0,0,0,.28)!important;
  backdrop-filter:blur(18px)!important;
}
.leaflet-bottom{bottom:166px!important}

/* SIDEBAR */
.head{padding:14px 15px 10px!important}
.head h1{font-size:19px!important;line-height:1.15!important;margin:0 0 4px!important;letter-spacing:-.02em}
.sub{font-size:11.5px!important;line-height:1.4!important;color:var(--muted)!important;max-width:30ch}
.panel-body{padding-bottom:4px}
.locator-card,.weather-card,.area-compare,.legend,.radar-card,.data-card{
  margin:0 10px 10px!important;
  padding:11px!important;
  border:1px solid var(--line)!important;
  border-radius:14px!important;
  background:rgba(255,255,255,.035)!important;
  box-shadow:none!important;
}
.locator-title,.weather-title{
  font-size:10px!important;
  letter-spacing:.08em!important;
  text-transform:uppercase!important;
  font-weight:900!important;
  color:#bdc8c1!important;
}
.locator-search-row{gap:6px!important}
.locator-search-wrap input{
  background:#f6f8f6!important;
  color:#152019!important;
  border-radius:11px!important;
  padding:10px 11px!important;
  font-size:12.5px!important;
}
button{
  border-radius:10px!important;
  border:1px solid var(--line)!important;
  background:var(--surface-2)!important;
  color:var(--text)!important;
  box-shadow:none!important;
  font-size:11px!important;
  font-weight:800!important;
  padding:8px 10px!important;
}
button:hover{background:var(--surface-3)!important}
button.active,.species-mode-btn.active,.mode.active,.analyze-btn{
  background:var(--green-soft)!important;
  color:#162319!important;
  border-color:#a7d8b1!important;
}
.locator-actions{gap:6px!important;margin-top:8px!important}
.locator-actions button{padding:7px 9px!important}
.radius-label{font-size:9px!important;color:var(--muted)!important}
.radius-label select{padding:6px!important;border-radius:9px!important}
.selected-locations{margin-top:8px!important}
.location-chip{
  padding:7px 8px!important;
  border-radius:10px!important;
  border:1px solid var(--line)!important;
  background:rgba(0,0,0,.13)!important
}
.location-name{font-size:10px!important}
.location-coord{display:none!important}
.locator-bottom{margin-top:7px!important}
#analyzeSelected{display:none!important} /* analiza jest automatyczna */
#clearSelected{margin-left:auto!important;padding:6px 9px!important}
.locator-hint{font-size:9px!important;color:#8e9b94!important;margin-top:5px!important}

/* FILTRY — dwie proste segmentacje */
.species-picker{padding:0 10px 8px!important}
.species-mode-switch{
  grid-template-columns:1fr 1fr!important;
  gap:6px!important;
  margin-bottom:6px!important
}
.species-mode-btn{
  min-height:45px!important;
  border-radius:12px!important;
  padding:7px 8px!important;
  text-align:center!important;
  font-size:10px!important;
  line-height:1.12!important
}
.species-mode-selected{
  grid-column:1/-1!important;
  padding:6px 8px!important;
  border-radius:9px!important;
  font-size:9px!important;
  color:#a9b7ae!important;
  background:rgba(88,200,120,.06)!important;
  border:1px solid rgba(88,200,120,.12)!important
}
.species-meta{display:none!important}
.modebar{
  padding:0 10px 7px!important;
  display:grid!important;
  grid-template-columns:1fr 1fr!important;
  gap:6px!important
}
.modebar .mode{padding:8px!important;text-align:center!important}
.ui-mode-help{
  padding:0 12px 10px;
  font-size:9.5px;
  color:#8f9d95;
  line-height:1.35
}

/* WEATHER: domyślnie tylko najważniejsze 4 liczby */
.weather-card{padding:10px 11px!important}
.weather-score{font-size:30px!important}
.weather-verdict{font-size:11.5px!important;margin-top:2px!important}
.weather-pill{font-size:9px!important;padding:3px 6px!important}
.combined-row{margin-top:5px!important}
.combined-pill{font-size:8.5px!important;padding:3px 6px!important}
.metrics{
  grid-template-columns:1fr 1fr!important;
  gap:6px!important;
  margin-top:9px!important
}
.metric{
  display:none;
  padding:7px 8px!important;
  border-radius:9px!important;
  background:rgba(255,255,255,.035)!important
}
.metric:nth-child(2), /* deszcz 14 */
.metric:nth-child(5), /* wilgotność gleby */
.metric:nth-child(8), /* suchy ciąg */
.metric:nth-child(10){display:block} /* prognoza */
.metric span{font-size:8.7px!important;color:#8f9d95!important}
.metric b{font-size:12px!important;margin-top:1px!important}
.weather-tip{font-size:9.5px!important;margin-top:7px!important;padding-top:7px!important;color:#b9c4bd!important}
.weather-source{display:none!important}

/* potrzebna legenda, ale bez ściany tekstu */
.legend{padding:8px 10px!important}
.legend > div:last-child{display:none!important}
.gradient{height:8px!important}
.gradient-labels{font-size:8.5px!important;margin-top:4px!important}

/* akcje: 3 podstawowe, reszta po "Więcej" */
.actions{
  padding:0 10px 9px!important;
  display:grid!important;
  grid-template-columns:1fr 1fr 1fr!important;
  gap:6px!important
}
.actions button{padding:7px 6px!important;font-size:9.5px!important}
.ui-advanced-control{display:none!important}
.panel.show-advanced .ui-advanced-control{display:block!important}
.panel.show-advanced .actions{grid-template-columns:repeat(3,1fr)!important}

/* zaawansowane rzeczy domyślnie schowane */
.data-card,.stable-note,.note,.top-title,.toplist-wrap{display:none!important}
.panel.show-advanced .data-card,
.panel.show-advanced .top-title,
.panel.show-advanced .toplist-wrap{display:block!important}
.panel.show-advanced .metrics .metric{display:block!important}
.panel.show-advanced .weather-source{display:block!important}
.panel.show-advanced .legend > div:last-child{display:block!important}

/* porównanie pokazuje się automatycznie dopiero przy >=2 rejonach */
.area-compare{display:none!important}
.panel.has-comparison .area-compare{display:block!important}
.area-compare-title{font-size:10px!important;margin-bottom:6px!important}
.area-compare-grid{grid-template-columns:1fr!important;gap:5px!important}
.area-card{padding:8px!important;border-radius:10px!important}
.area-result{font-size:9px!important}
.status{
  padding:8px 11px!important;
  font-size:9.5px!important;
  line-height:1.35!important;
  color:#aebbb3!important;
  border-top:1px solid var(--line)!important
}

/* ATLAS — niższy, prostszy, dużo mniej ramek */
.atlas-head{
  height:38px!important;
  padding:0 11px!important;
  gap:8px!important;
  border-bottom:1px solid var(--line)!important
}
.atlas-head-title{font-size:12px!important;font-weight:900!important}
.atlas-head-info{font-size:9.5px!important;color:#95a29a!important}
.atlas-head-actions{gap:4px!important}
.atlas-head-actions button,.atlas-head-actions a{
  height:24px!important;
  padding:0 7px!important;
  font-size:8.5px!important;
  border-radius:8px!important;
  text-decoration:none!important
}
.atlas-strip-wrap{padding:7px 9px 8px!important}
.atlas-strip{gap:7px!important;padding-bottom:4px!important}
.atlas-group-card{
  flex:0 0 184px!important;
  min-height:102px!important;
  border-radius:12px!important;
  background:rgba(255,255,255,.025)!important;
  border:1px solid var(--line)!important;
  transform:none!important
}
.atlas-group-card:hover{border-color:rgba(255,255,255,.18)!important}
.atlas-group-card.group-selected{border-color:#6bd485!important;box-shadow:0 0 0 1px rgba(107,212,133,.15) inset!important}
.atlas-group-head{
  height:34px!important;
  grid-template-columns:24px 1fr auto!important;
  gap:5px!important;
  padding:3px 5px!important;
  background:rgba(255,255,255,.035)!important
}
.atlas-group-icon{width:22px!important;height:22px!important;border-radius:6px!important}
.atlas-group-title{font-size:8.8px!important;line-height:1!important}
.atlas-group-sub{display:none!important}
.atlas-group-check{width:18px!important;height:18px!important;font-size:8px!important}
.atlas-mini-grid{gap:4px!important;padding:5px!important}
.atlas-mini{
  height:59px!important;
  border-radius:8px!important;
  border:1px solid rgba(255,255,255,.07)!important;
  background:rgba(0,0,0,.12)!important
}
.atlas-mini-name{
  height:21px!important;
  padding:2px!important;
  font-size:6.8px!important;
  line-height:1!important;
  background:rgba(0,0,0,.14)!important
}
.atlas-mini-photo{min-height:35px!important}
.atlas-mini-check{width:14px!important;height:14px!important;font-size:7px!important;right:2px!important;top:2px!important}
.atlas-mini-score{top:23px!important;font-size:6.5px!important}
.atlas-family-note{display:none!important}
.atlas-source{display:none!important}

/* map controls nad atlasem */
.leaflet-bottom{bottom:132px!important}

/* ===== public: hotspot species labels with real mushroom icons ===== */
.species-hint{
  pointer-events:none!important;
  display:block!important;
  max-width:none!important;
  transform:translate(-10px,-38px)!important;
}
.species-hint.compact{
  transform:translate(-2px,-28px)!important;
}
.species-hint-stack{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  max-width:178px;
}
.species-hint-item,
.species-hint-moreline{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
  padding:3px 7px 3px 4px;
  min-height:24px;
  border-radius:9px;
  background:rgba(15,19,17,.92);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 3px 10px rgba(0,0,0,.24);
  color:#eef4ef;
  backdrop-filter:blur(8px);
}
.species-hint-item{
  max-width:178px;
}
.species-hint-thumb{
  width:18px;
  height:18px;
  flex:0 0 18px;
  border-radius:6px;
  overflow:hidden;
  background:rgba(75,121,82,.22);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
}

  width:100%;height:100%;display:block;object-fit:cover;
}

  min-width:0;

  line-height:1.08;
}

  padding:2px 8px;

  border-style:dashed;

  font-weight:900;
}
.species-hint-dot{
  width:24px;height:24px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  gap:0;
  padding:0 3px;
  background:rgba(15,19,17,.92);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 3px 10px rgba(0,0,0,.25);
}
.species-hint-dot img{
  width:14px;height:14px;border-radius:4px;object-fit:cover;display:block;
}
.species-hint-dot img+img{margin-left:-3px;box-shadow:0 0 0 1px rgba(15,19,17,.92)}
@media(max-width:700px){
  .species-hint{transform:translate(-7px,-34px)!important}
  .species-hint-stack{max-width:140px;gap:3px}

}
