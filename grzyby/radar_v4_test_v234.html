<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar v4 v234 — test viewport-gap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;background:#111;font-family:system-ui,sans-serif}
#box{position:absolute;z-index:1000;left:10px;top:10px;background:#151a17ef;color:#eee;padding:10px 12px;border-radius:10px;font:12px/1.45 system-ui;max-width:390px;box-shadow:0 8px 24px #0008}
b{color:#b9efc0}.ok{color:#8ee59d}.warn{color:#ffd36a}code{font-size:10px;word-break:break-all}.btn{margin-top:8px;border:1px solid #ffffff22;background:#29302c;color:#fff;border-radius:8px;padding:6px 8px;cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>
<div id="box">⏳ Start testu Radar v4 v234…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./radar_v4_loader.js?v=233"></script>
<script>
(async()=>{
 const box=document.getElementById('box');
 const map=L.map('map',{preferCanvas:true}).setView([50.67,17.93],10);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 const r=new RadarV4('./data/radar_v4',{maxCacheEntries:160});
 let cal=null,seq=0,layer=L.layerGroup().addTo(map),prevTiles='',prevSig='';
 function viewportSig(b){return [b.west,b.south,b.east,b.north].map(v=>Number(v).toFixed(5)).join(',');}
 function padded(b){const dx=Math.min(.16,Math.max(.025,(b.east-b.west)*.07)),dy=Math.min(.10,Math.max(.018,(b.north-b.south)*.07));return {west:b.west-dx,east:b.east+dx,south:b.south-dy,north:b.north+dy};}
 function pct(entry,u){
   if(!entry?._p){let s=0;entry._p=new Float64Array(entry.counts.length+1);for(let i=0;i<entry.counts.length;i++){entry._p[i]=s;s+=entry.counts[i]||0;}entry._p[entry.counts.length]=s;entry._n=s;}
   const i=Math.max(0,Math.min(entry.counts.length-1,Math.round(u))),c=entry.counts[i]||0,n=entry._n,less=entry._p[i];return n<=1?1:(less+(Math.max(1,c)-1)/2)/(n-1);
 }
 function color(p){return p>=.9?'#116f38':p>=.75?'#54ab5d':p>=.55?'#a39f46':p>=.35?'#ca8850':'#d5c2b0';}
 async function draw(){
   const my=++seq,t0=performance.now();await r.init();
   if(!cal){const cr=await fetch('./data/radar_v4/calibration.json');if(!cr.ok)throw new Error('calibration HTTP '+cr.status);cal=await cr.json();}
   const z=map.getZoom(),lod=(z===12&&r.availableLods().includes(500))?500:1000;
   const b=map.getBounds(),view={west:b.getWest(),east:b.getEast(),south:b.getSouth(),north:b.getNorth()},load=padded(view);
   const keys=r.tileKeysForBounds(load,lod),tiles=keys.map(k=>k.y+','+k.x).join(';'),sig=viewportSig(view);
   const sameTiles=prevTiles&&tiles===prevTiles,changedViewport=prevSig&&sig!==prevSig;
   const rows=await r.loadViewport({cellMeters:lod,bounds:load,overview:true});if(my!==seq)return;
   layer.clearLayers();const e=cal.lods[lod+'m'].overview;let shown=0;
   for(const c of rows){const p=pct(e,Math.round(c.raw*100));if(!Number.isFinite(p))continue;L.rectangle([[c.bounds.south,c.bounds.west],[c.bounds.north,c.bounds.east]],{renderer:L.canvas(),stroke:false,fill:true,fillColor:color(p),fillOpacity:.07+.34*p,interactive:false}).addTo(layer);shown++;}
   const proof=(sameTiles&&changedViewport)?'<span class="ok"><b>PASS:</b> viewport zmienił się przy tym samym zestawie tile IDs — v234 odświeżył subset zamiast użyć starego.</span>':'Przesuń mapę lekko w bok bez zmiany zoomu. Jeśli tile IDs zostaną te same, tester pokaże PASS klucza viewport.';
   box.innerHTML=`<b>Radar v4 v234 — viewport-gap test</b><br>LOD: ${lod} m • z${z}<br>Komórki z padded viewport: ${rows.length}<br>Rysowane: ${shown}<br>Tile IDs: ${keys.length}<br>Requesty: ${r.stats.requests} • cache hits: ${r.stats.cacheHits}<br>Pobrano: ${(r.stats.bytes/1024).toFixed(0)} KiB • ${(performance.now()-t0).toFixed(1)} ms<br><br>${proof}<br><br><small>viewportSig:</small><br><code>${sig}</code>`;
   prevTiles=tiles;prevSig=sig;
 }
 map.on('moveend zoomend',()=>draw().catch(e=>box.textContent='❌ '+e.message));
 draw().catch(e=>box.textContent='❌ '+e.message);
})();
</script>
</body>
</html>
